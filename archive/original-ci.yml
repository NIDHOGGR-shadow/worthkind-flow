name: Worthkind Flow · P0 tests

on:
  pull_request:
    paths:
      - 'projects/worthkind-flow/**'
      - '.github/workflows/worthkind-flow-ci.yml'
  push:
    branches: [main]
    paths:
      - 'projects/worthkind-flow/**'
      - '.github/workflows/worthkind-flow-ci.yml'
permissions:
  contents: read
jobs:
  p0-api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r projects/worthkind-flow/apps/api/requirements-dev.txt
      - name: Unit and contract tests
        env:
          WF_ENV: development
          PYTHONPATH: projects/worthkind-flow/apps/api
        run: python -m pytest projects/worthkind-flow/apps/api/tests -q
      - name: Standalone local SQLite SLA contract smoke
        run: python projects/worthkind-flow/scripts/sla_isolated_smoke.py

  p0-web:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate guest and staff JavaScript syntax
        run: |
          node --check projects/worthkind-flow/apps/web/app.js
          node --check projects/worthkind-flow/apps/web/staff.js
          node --check projects/worthkind-flow/apps/web/tickets.js
          node --check projects/worthkind-flow/apps/web/operations.js
          node --check projects/worthkind-flow/apps/web/knowledge.js
      - name: Exercise staff workspace behavior without third-party browser libraries
        run: node --test projects/worthkind-flow/apps/web/tests/staff-ui.test.cjs
      - name: Exercise guest receipt recovery and retry without external services
        run: node --test projects/worthkind-flow/apps/web/tests/guest-recovery.test.cjs
      - name: Test ticket workspace tenant context and form interactions
        run: node --test projects/worthkind-flow/apps/web/tests/tickets-ui.test.cjs
      - name: Test SQLite-backed property operations dashboard interactions
        run: node --test projects/worthkind-flow/apps/web/tests/operations-ui.test.cjs
      - name: Verify SQLite knowledge editor interaction and privacy
        run: node --test projects/worthkind-flow/apps/web/tests/knowledge-ui.test.cjs

  site-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing Worthkind website dependencies
        run: npm ci
      - name: Verify original movement website
        run: |
          npm test
          npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local API and real-browser test dependencies
        run: |
          python -m pip install -r projects/worthkind-flow/apps/api/requirements-dev.txt
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Run actual mobile and desktop Chromium journeys against disposable local SQLite
        env:
          WF_ENV: development
        run: python projects/worthkind-flow/scripts/browser_smoke.py
