name: Backend runtime boundary

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/backend-runtime.yml'
      - 'db/**'
  push:
    branches: ['work/backend-infrastructure-hardening']
    paths:
      - 'apps/api/**'
      - '.github/workflows/backend-runtime.yml'
      - 'db/**'

permissions:
  contents: read

jobs:
  backend-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    env:
      WF_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'httpx>=0.27,<1'
      - run: python -m unittest -v test_runtime_boundary test_runtime_api test_supabase_identity test_staging_crypto test_cutover_inventory

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: worthkind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WF_ENV: test
      WF_TEST_POSTGRES_DSN: postgresql://postgres:disposable_ci_only@127.0.0.1:5432/worthkind_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/api/requirements.txt -r apps/api/requirements-pg-test.txt
      - run: python -m pytest apps/api/tests_pg -q
