name: Backend runtime boundary

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/backend-runtime.yml'
  push:
    branches: ['work/backend-infrastructure-hardening']
    paths:
      - 'apps/api/**'
      - '.github/workflows/backend-runtime.yml'

permissions:
  contents: read

jobs:
  backend-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    env:
      WF_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'httpx>=0.27,<1'
      - run: python -m unittest -v test_runtime_boundary test_runtime_api
