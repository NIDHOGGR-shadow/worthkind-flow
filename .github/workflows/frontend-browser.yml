name: Frontend contract and browser checks
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'scripts/local_dev.py'
      - '.github/workflows/frontend-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript contract tests
        run: node --test apps/web/tests/*.test.cjs
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r apps/api/requirements-dev.txt playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Actual browser journey and viewport checks
        run: python apps/web/tests/browser_journey.py
